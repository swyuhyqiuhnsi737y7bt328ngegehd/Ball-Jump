      showToast('已导出 ' + customLevels.length + ' 个关卡');
    } catch (err) {
      showToast('导出失败：' + err.message);
    }
  };

  document.getElementById('menu-import').onclick = function () {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function () {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const arr = JSON.parse(reader.result);
          if (!Array.isArray(arr)) throw new Error('文件内容不是关卡数组');
          const added = [];
          for (let i = 0; i < arr.length; i++) {
            const lv = normalizeLevel(arr[i]);
            if (lv) added.push(lv);
          }
          if (added.length === 0) throw new Error('没有有效的关卡');

          for (let i = 0; i < added.length; i++) customLevels.push(added[i]);
          persistCustomLevels();
          buildMenu();
          showToast('已导入 ' + added.length + ' 个关卡');
        } catch (err) {
          showToast('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  /* ============================================================
     编辑器渲染
  ============================================================ */
  function drawEditor(t) {
    const lv = editLevel;

    drawBackground(t);

    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(120, 170, 255, .09)';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = 0; y <= H; y += 20) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(120, 170, 255, .2)';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 100) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = 0; y <= H; y += 100) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
    ctx.restore();

    for (let i = 0; i < lv.platforms.length; i++) drawPlatform(lv.platforms[i]);
    for (let i = 0; i < lv.spikes.length; i++)    drawSpikes(lv.spikes[i]);
    drawItems(t, true);

    ctx.save();
    ctx.strokeStyle = 'rgba(94, 234, 212, .9)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(lv.spawn.x, lv.spawn.y, 17, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(94, 234, 212, .25)';
    ctx.beginPath();
    ctx.arc(lv.spawn.x, lv.spawn.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5eead4';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('起点', lv.spawn.x, lv.spawn.y - 24);
    ctx.restore();

    drawGoal(lv.goal, t);

    if (edState.draft) {
      const d = edState.draft;
      const x = Math.min(d.x0, d.x1);
      const y = Math.min(d.y0, d.y1);
      const w = Math.abs(d.x1 - d.x0);
      const h = Math.abs(d.y1 - d.y0);

      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1.5;
      if (edState.tool === 'platform') {
        ctx.strokeStyle = 'rgba(125, 211, 252, .95)';
        ctx.fillStyle = 'rgba(56, 189, 248, .18)';
      } else if (edState.tool === 'spike') {
        ctx.strokeStyle = 'rgba(255, 120, 150, .95)';
        ctx.fillStyle = 'rgba(255, 60, 100, .18)';
      } else {
        ctx.strokeStyle = 'rgba(196, 181, 253, .95)';
        ctx.fillStyle = 'rgba(139, 92, 246, .18)';
      }
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x + .5, y + .5, w, h);
      ctx.restore();
    }

    const selObj = getSelectedObject();
    if (selObj) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 220, 120, .95)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);

      if ('w' in selObj && 'h' in selObj) {
        ctx.strokeRect(selObj.x - 2, selObj.y - 2, selObj.w + 4, selObj.h + 4);
      } else if ('r' in selObj) {
        ctx.beginPath();
        ctx.arc(selObj.x, selObj.y, selObj.r + 4, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        const rr = (selObj.r || 22) + 5;
        ctx.beginPath();
        ctx.arc(selObj.x, selObj.y, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    {
      const sel = edState.selected;
      if (sel && sel.kind === 'item') {
        const selItem = editLevel.items[sel.index];
        if (selItem && selItem.type === 'portal') {
          const info = getPortalPairInfo(editLevel.items, sel.index);
          if (info && info.partnerIndex >= 0) {
            const partner = editLevel.items[info.partnerIndex];

            ctx.save();
            ctx.strokeStyle = 'rgba(94, 234, 212, .55)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(selItem.x, selItem.y);
            ctx.lineTo(partner.x, partner.y);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = 'rgba(94, 234, 212, .95)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            ctx.arc(partner.x, partner.y, (partner.r || 24) + 9, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            const mx = (selItem.x + partner.x) / 2;
            const my = (selItem.y + partner.y) / 2;
            ctx.save();
            ctx.font = 'bold 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0, 0, 0, .6)';
            ctx.strokeText('配对', mx, my);
            ctx.fillStyle = '#5eead4';
            ctx.fillText('配对', mx, my);
            ctx.restore();
          }
        }
      }
    }

    if (edState.tool === 'move' || edState.tool === 'erase') {
      const hit = hitTest(edState.mouse);
      if (hit && hit.obj) {
        ctx.save();
        ctx.strokeStyle = edState.tool === 'erase'
          ? 'rgba(255, 90, 120, .95)'
          : 'rgba(255, 220, 120, .7)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        if ('w' in hit.obj && 'h' in hit.obj) {
          ctx.strokeRect(hit.obj.x - 1, hit.obj.y - 1, hit.obj.w + 2, hit.obj.h + 2);
        } else {
          ctx.beginPath();
          ctx.arc(hit.obj.x, hit.obj.y, (hit.obj.r || 20) + 3, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    ctx.save();
    ctx.font = '12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(160, 195, 245, .5)';
    ctx.textAlign = 'left';
    const toolTips = {
      move: '拖动已有物体移动它 · 点选后可调属性',
      platform: '在空白处拖拽画出平台',
      spike: '拖拽画出尖刺（朝向可在右侧切换）',
      spring: '拖拽画出弹簧（力度可在右侧调）',
      boost: '拖拽画出加速带（方向/力度可在右侧调）',
      coin: '点击放置金币',
      portal: '点击放置传送门（按顺序两两配对）',
      checkpoint: '点击放置存档点（球经过后死亡会从这里重生）',
      spawn: '点击设置起点位置',
      goal: '点击设置终点位置',
      erase: '点击物体删除它（右键也可删除）'
    };
    ctx.fillText(
      '平台 ' + lv.platforms.length +
      '　·　尖刺 ' + lv.spikes.length +
      '　·　道具 ' + lv.items.length +
      '　·　' + (toolTips[edState.tool] || ''),
      14, H - 16
    );
    ctx.restore();
  }

  function drawNoLevel(t) {
    drawBackground(t);

    ctx.save();
    ctx.textAlign = 'center';

    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    roundRectPath(ctx, W / 2 - 190, H / 2 - 80, 380, 160, 20);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.font = 'bold 22px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(200, 220, 255, .6)';
    ctx.fillText('从菜单选择一个关卡', W / 2, H / 2 - 12);

    ctx.font = '14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(160, 195, 245, .45)';
    ctx.fillText('或点击 ＋ 新建你自己的关卡', W / 2, H / 2 + 22);

    ctx.restore();
  }

  /* ============================================================
     渲染主函数
  ============================================================ */
  function render() {
    const t = performance.now() / 1000;

    resetT();
    ctx.clearRect(0, 0, W, H);

    if (editorOpen) {
      drawEditor(t);
      return;
    }

    if (!level) {
      drawNoLevel(t);
      return;
    }

    if (shakeTime > 0) {
      const m = shakeTime * 22;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }

    drawBackground(t);

    for (let i = 0; i < level.platforms.length; i++) drawPlatform(level.platforms[i]);
    for (let i = 0; i < level.spikes.length; i++)    drawSpikes(level.spikes[i]);
    drawItems(t, false);

    drawGoal(level.goal, t);
    drawParticles();
    drawBall();
    drawHUD();
  }

  /* ============================================================
     主循环（含变速、冻结、逐帧）
  ============================================================ */
  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.25) dt = 0.25;

    if (frozen) {
      /* 冻结时只处理排队的步数 */
      let steps = 0;
      while (stepQueue > 0 && steps < 300) {
        if (state === 'playing' && !paused && level) update(FIXED);
        updateEffects(FIXED);
        physicsStepCount++;
        stepQueue--;
        steps++;
      }
      if (stepQueue > 0) stepQueue = 0;
      accumulator = 0;
    } else {
      accumulator += dt * timeScale;
      let guard = 0;
      while (accumulator >= FIXED && guard < 200) {
        if (state === 'playing' && !paused && level) update(FIXED);
        updateEffects(FIXED);
        physicsStepCount++;
        accumulator -= FIXED;
        guard++;
      }
      if (guard >= 200) accumulator = 0;
    }

    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     启动
  ============================================================ */
  layoutCanvas();
  window.addEventListener('resize', layoutCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(layoutCanvas, 60);
  });

  storageOK = detectStorage();
  loadCustomLevels();

  playlist = customLevels;

  openMenu();
  requestAnimationFrame(loop);

  if (!storageOK) {
    setTimeout(function () {
      showToast('提示：当前环境无法自动保存，请用「导出全部」备份');
    }, 1200);
  }

})();
</script>
